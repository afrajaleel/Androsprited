// The native libraries, SDL's Java glue and the data/ folder are produced
// by ../build-native.sh into ../build/ - run that first (see ../README.md).

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def nativeBuild = file("$rootDir/build")

android {
    namespace 'com.veritaware.besprited'
    compileSdk 35

    defaultConfig {
        applicationId 'com.veritaware.besprited'
        minSdk 28
        targetSdk 35
        // CI passes -PversionCode=<run number> so each build can be
        // installed over the previous one.
        versionCode((project.findProperty('versionCode') ?: '1') as int)
        versionName project.findProperty('versionName') ?: 'dev'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        // A fixed key from GitHub secrets keeps the signature stable, so
        // updates install over each other. Without one, the debug key is
        // used (fine on one machine; CI makes a new one each run).
        release {
            def ks = System.getenv('BESPRITED_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('BESPRITED_KEYSTORE_PASSWORD')
                keyAlias System.getenv('BESPRITED_KEY_ALIAS')
                keyPassword System.getenv('BESPRITED_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('BESPRITED_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    sourceSets {
        main {
            java.srcDirs += ["$nativeBuild/sdl-java"]
            jniLibs.srcDirs = ["$nativeBuild/jniLibs"]
            assets.srcDirs = ["$nativeBuild/assets"]
        }
    }

    packagingOptions {
        jniLibs {
            // Already stripped by build-native.sh
            keepDebugSymbols += ['**/*.so']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
}

tasks.register('checkNativeBuild') {
    doLast {
        if (!file("$nativeBuild/jniLibs/arm64-v8a/libmain.so").exists()) {
            throw new GradleException("Native libraries missing: run android/build-native.sh first")
        }
    }
}
preBuild.dependsOn checkNativeBuild
