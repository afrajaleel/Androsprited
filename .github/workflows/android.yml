name: Android

# Builds the Android app (android/README.md) and uploads the APK as a
# workflow artifact. Runs on pushes to trunk, android and android-* branches, on pull
# requests, and by hand from the Actions tab ("Run workflow").

on:
  push:
    branches: [ trunk, android, 'android-*' ]
  pull_request:
    branches: [ trunk ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Same NDK as SDL's own Android project template uses.
  NDK_VERSION: 28.2.13676358

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build
        # The project needs CMake 4.1+, newer than Ubuntu's.
        pipx install "cmake>=4.1"
        cmake --version

    - name: Set up the Android SDK and NDK
      run: |
        SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          mkdir -p "$SDK/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -O /tmp/ct.zip
          unzip -q /tmp/ct.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
        fi
        yes | "$SDKMANAGER" --licenses >/dev/null || true
        "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION" >/dev/null
        echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_HOME=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

    - name: Restore third-party libraries from cache
      uses: actions/cache@v4
      with:
        path: |
          android/build/src
          android/build/arm64-v8a/prefix
        key: android-deps-${{ env.NDK_VERSION }}-${{ hashFiles('android/fetch-sources.sh', 'android/deps/**') }}

    - name: Build native libraries
      run: |
        set -o pipefail
        if ! android/build-native.sh 2>&1 | tee "$RUNNER_TEMP/native.log"; then
          # Surface the first errors as annotations on the run summary.
          grep -n -E "error:|CMake Error|FAILED:|undefined reference|fatal:" "$RUNNER_TEMP/native.log" \
            | grep -v -E "Werror|error\.h|jerror|errno|-Wno-error" | head -12 \
            | while IFS= read -r line; do echo "::error title=build-native::${line:0:900}"; done
          tail -n 25 "$RUNNER_TEMP/native.log" | tr '\n' '|' | sed 's/^/::error title=build-native tail::/; s/$/\n/' | cut -c1-3900
          exit 1
        fi

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'
        # This project uses no Gradle wrapper; the only wrapper jars in the
        # workspace come from downloaded third-party sources (SDL's sample
        # project), which the validator would otherwise reject.
        validate-wrappers: false

    - name: Build APK
      working-directory: android
      env:
        KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        BESPRITED_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        BESPRITED_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        BESPRITED_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        # Sign with your own key when the repository has one (see
        # android/README.md), so new builds install over old ones.
        if [ -n "$KEYSTORE_B64" ]; then
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export BESPRITED_KEYSTORE="$RUNNER_TEMP/release.keystore"
        fi
        set -o pipefail
        if ! gradle --no-daemon assembleRelease \
          -PversionCode=${{ github.run_number }} \
          -PversionName="$(git rev-parse --short HEAD)" 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
          # Surface Gradle's error report as an annotation on the run summary.
          sed -n '/What went wrong/,/Try:/p' "$RUNNER_TEMP/gradle.log" | head -40 | tr '\n' '|' \
            | cut -c1-3900 | sed 's/^/::error title=gradle::/'
          echo
          grep -E "error:|e: " "$RUNNER_TEMP/gradle.log" | head -10 | while IFS= read -r l; do echo "::error title=gradle::${l:0:900}"; done
          exit 1
        fi
        mkdir -p ../dist
        cp app/build/outputs/apk/release/app-release.apk ../dist/besprited-android-${{ github.run_number }}.apk

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: besprited-android
        path: dist/*.apk
